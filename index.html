<title>YSC Hub Preview</title>
<style>
  /* ──────────────────────────────────────────────────────────────────────
     Deliberately single visual world: a Homestead/Miami performance-campus
     palette lifted from sperformancehub.com (deep navy + acid lime + warm
     sand paper). This is a controlled pitch asset shown on known hardware,
     so it commits to one look rather than adapting to viewer theme — colors
     are painted explicitly throughout, no prefers-color-scheme branching.
  ───────────────────────────────────────────────────────────────────────*/
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800;900&family=Public+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

  :root{
    --navy-deep:#16203D; --navy:#23315F; --navy-soft:#31427A; --navy-line:#3B4C86;
    --lime:#C7D22B; --lime-dim:#9AA61F; --lime-ink:#1B230A;
    --paper:#F6F4EC; --paper-dim:#ECE7D6; --paper-card:#FFFDF7;
    --ink:#16203D; --ink-soft:#525C79; --ink-faint:#8891A8;
    --line:#DED8C2;
    --good:#1E8F6F; --good-bg:#E1F1E9; --good-line:#BEE0CE;
    --warn:#D8862E; --warn-bg:#FBEEDC; --warn-line:#F0CE9C;
    --danger:#C24B3F; --danger-bg:#F7E3E0; --danger-line:#E7B7AF;
    --font-display:'Archivo',"Arial Black",sans-serif;
    --font-body:'Public Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-mono:'Space Mono',ui-monospace,Menlo,monospace;
  }

  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;}
  p{margin:0;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--lime);color:var(--lime-ink);}

  .eyebrow{font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;}

  /* ── App shell ─────────────────────────────────────────────────────── */
  #app{min-height:100vh;display:flex;flex-direction:column;}

  .topbar{background:var(--navy-deep);color:#fff;position:sticky;top:0;z-index:40;
    box-shadow:0 1px 0 var(--navy-line);}
  .topbar-inner{max-width:1400px;margin:0 auto;padding:0 22px;height:68px;
    display:flex;align-items:center;gap:24px;}
  .brand{display:flex;align-items:center;gap:11px;flex-shrink:0;}
  .brand-mark{width:34px;height:34px;border-radius:50%;background:conic-gradient(from 210deg,var(--lime),var(--navy-soft) 55%,var(--lime));
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand-mark span{width:16px;height:16px;border-radius:50%;background:var(--navy-deep);}
  .brand-word{line-height:1.05;}
  .brand-word b{display:block;font-family:var(--font-display);font-weight:900;font-size:16.5px;
    letter-spacing:.01em;}
  .brand-word small{display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;
    color:var(--lime);text-transform:uppercase;margin-top:1px;}

  .role-switch{display:flex;gap:6px;background:rgba(255,255,255,.06);border:1px solid var(--navy-line);
    border-radius:999px;padding:4px;margin-left:auto;}
  .role-btn{border:none;background:transparent;color:#B9C1DC;font-family:var(--font-mono);
    font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    padding:8px 18px;border-radius:999px;transition:background .15s,color .15s;position:relative;}
  .role-btn.active{background:var(--lime);color:var(--lime-ink);}
  .role-btn:not(.active):hover{color:#fff;}

  .demo-tag{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:10.5px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--navy-deep);background:var(--lime);
    border-radius:6px;padding:7px 11px;flex-shrink:0;}
  .demo-tag i{width:6px;height:6px;border-radius:50%;background:var(--danger);flex-shrink:0;
    box-shadow:0 0 0 3px rgba(194,75,63,.25);}

  /* the one recurring "brand handshake" — an angled lime band, echoing the
     diagonal motif from the SPH site — marks whichever role is live */
  .angle-band{height:5px;background:var(--lime);transform:skewY(-.6deg);transform-origin:left;
    box-shadow:0 1px 0 rgba(0,0,0,.08);}

  /* ── Campus backdrop band ─────────────────────────────────────────── */
  .hero-band{position:relative;height:190px;overflow:hidden;background:var(--navy-deep);}
  .hero-band img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    object-position:center 42%;opacity:.55;}
  .hero-band::before{content:"";position:absolute;inset:0;
    background:linear-gradient(100deg,var(--navy-deep) 18%,rgba(22,32,61,.55) 55%,rgba(22,32,61,.25) 100%);}
  .hero-band-text{position:relative;z-index:1;max-width:1400px;margin:0 auto;height:100%;
    padding:0 22px;display:flex;flex-direction:column;justify-content:center;gap:8px;}
  .hero-band-text .eyebrow{color:var(--lime);}
  .hero-band-text h2{color:#fff;font-size:26px;font-weight:900;max-width:560px;line-height:1.15;}
  .hero-band .angle-band{position:absolute;left:0;right:0;bottom:0;}

  main{flex:1;max-width:1400px;margin:0 auto;padding:26px 22px 60px;width:100%;}

  .view{display:none;}
  .view.active{display:block;}

  .view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
    margin-bottom:20px;flex-wrap:wrap;}
  .view-head h1{font-size:30px;font-weight:900;color:var(--navy-deep);letter-spacing:-.01em;}
  .view-head .eyebrow{color:var(--lime-dim);margin-bottom:6px;display:block;}
  .view-sub{font-size:14px;color:var(--ink-soft);max-width:520px;line-height:1.5;}

  .hub-tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:22px;
    overflow-x:auto;}
  .hub-tab{border:none;background:none;font-family:var(--font-mono);font-size:12px;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);padding:11px 16px 13px;
    border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:color .15s;}
